name: Analyze & Format

on:
  push:
    branches:
        - develop
  pull_request:
    branches:
        - develop

jobs:
  permissions:
    contents: write

  analyze_and_format:
    name: Analyze & Format checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.6"
          channel: 'stable'
          cache: true
          cache-key: "flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}"
          cache-path: "${{ runner.tool_cache }}/flutter"

      - name: Fetch dependencies
        run: flutter pub get

      - name: Generate necessary code
        run: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Analyze code
        run: flutter analyze

      - name: Apply dart fix
        run: dart fix --apply

        # This step is added to avoid build issue running dart format in ci, since dart format has
        # no way for now to exclude generated files.
      - name: Format generated App localizations
        run: dart format lib/l10n/generated/app_localizations.dart

      - name: Format code
        run: dart format .

      - name: Auto-commit formatting and fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix linting and formatting"
          commit_user_name: "Extro Bot"