name: PR Analyze & Format Checks

on:
  pull_request:
    branches: [ develop ]

jobs:
  analyze:
    name: Analyze & Format checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.6"
          channel: 'stable'
          cache: true
          cache-key: "flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}"
          cache-path: "${{ runner.tool_cache }}/flutter"

      - name: Fetch dependencies
        run: flutter pub get

      - name: Generate necessary code
        run: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Analyze code
        run: flutter analyze

        # This step is added to avoid build issue running dart format in ci, since dart format has
        # no way for now to exclude generated files.
      - name: Format generated App localizations
        run: dart format lib/l10n/generated/app_localizations.dart

      - name: Check code format
        run: dart format --set-exit-if-changed .

      - name: Run tests
        run: flutter test --coverage