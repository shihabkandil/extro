name: extro
description: A Flutter customer application following clean architecture.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  
  # Dependency Injection
  get_it: ^9.1.0
  injectable: ^2.3.2
  
  # Immutable Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.8.1
  
  # Network
  dio: ^5.3.3
  pretty_dio_logger: ^1.3.1
  
  # Functional Programming
  dartz: ^0.10.1
  
  # Code Generation
  intl: ^0.20.2
  
  # Authentication
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code Generation
  build_runner: ^2.10.4
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  injectable_generator: ^2.4.1

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/images/
    - assets/svgs/
